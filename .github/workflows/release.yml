name: release

# On a version tag, builds neoplanner for each platform the launcher supports, and
# publishes each as neoplanner-<target>.tar.gz with its .sha256, which the launcher
# checks before it runs anything it downloaded.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag, the crate and the plugin agree
        run: |
          tag=${GITHUB_REF_NAME#v}
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          echo "tag $tag, crate $crate, plugin $plugin"
          [ "$tag" = "$crate" ] && [ "$tag" = "$plugin" ]

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=neoplanner-${{ matrix.target }}.tar.gz
          tar -czf "$name" -C target/${{ matrix.target }}/release neoplanner
          if command -v sha256sum >/dev/null; then sha256sum "$name"; else shasum -a 256 "$name"; fi >"$name.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            neoplanner-${{ matrix.target }}.tar.gz
            neoplanner-${{ matrix.target }}.tar.gz.sha256
