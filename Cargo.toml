[package]
name = "neoplanner"
version = "0.1.0"
edition = "2024"
description = "Keeps a project's OpenSpec planning behind one agent, committed or in a stealth store, and the tools that agent uses."
repository = "https://github.com/ewilazarus/neoplanner"
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
